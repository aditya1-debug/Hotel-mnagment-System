<svg viewBox="0 0 1500 980" xmlns="http://www.w3.org/2000/svg" font-family="Consolas, 'Courier New', monospace">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L8,3 L0,6 Z" fill="#555" />
    </marker>
  </defs>

  <rect width="1500" height="980" fill="#fbfbfa" />
  <text x="30" y="35" font-size="20" font-weight="bold" fill="#1a1a1a">Food Ordering &amp; Restaurant Management — ER Diagram</text>
  <text x="30" y="56" font-size="13" fill="#666">MongoDB / Mongoose — references by ObjectId, order items are embedded (snapshotted at order time)</text>

  <!-- User -->
  <g>
    <rect x="40" y="90" width="270" height="250" rx="6" fill="#fff" stroke="#2563eb" stroke-width="2"/>
    <rect x="40" y="90" width="270" height="30" rx="6" fill="#2563eb"/>
    <text x="175" y="110" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">User</text>
    <text x="55" y="140" font-size="13" fill="#1a1a1a">_id : ObjectId (PK)</text>
    <text x="55" y="160" font-size="13" fill="#1a1a1a">name : String</text>
    <text x="55" y="180" font-size="13" fill="#1a1a1a">email : String (unique)</text>
    <text x="55" y="200" font-size="13" fill="#1a1a1a">password : String (hashed)</text>
    <text x="55" y="220" font-size="13" fill="#1a1a1a">phone : String</text>
    <text x="55" y="240" font-size="13" fill="#1a1a1a">address : String</text>
    <text x="55" y="260" font-size="13" fill="#1a1a1a">role : enum(customer, owner,</text>
    <text x="75" y="278" font-size="13" fill="#1a1a1a">delivery, admin)</text>
    <text x="55" y="298" font-size="13" fill="#1a1a1a">isActive : Boolean</text>
    <text x="55" y="318" font-size="13" fill="#1a1a1a">createdAt / updatedAt</text>
  </g>

  <!-- Restaurant -->
  <g>
    <rect x="440" y="90" width="270" height="250" rx="6" fill="#fff" stroke="#059669" stroke-width="2"/>
    <rect x="440" y="90" width="270" height="30" rx="6" fill="#059669"/>
    <text x="575" y="110" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Restaurant</text>
    <text x="455" y="140" font-size="13" fill="#1a1a1a">_id : ObjectId (PK)</text>
    <text x="455" y="160" font-size="13" fill="#1a1a1a">owner : ObjectId (FK → User)</text>
    <text x="455" y="180" font-size="13" fill="#1a1a1a">name : String</text>
    <text x="455" y="200" font-size="13" fill="#1a1a1a">description : String</text>
    <text x="455" y="220" font-size="13" fill="#1a1a1a">cuisine : String</text>
    <text x="455" y="240" font-size="13" fill="#1a1a1a">address : String</text>
    <text x="455" y="260" font-size="13" fill="#1a1a1a">image : String</text>
    <text x="455" y="280" font-size="13" fill="#1a1a1a">isActive : Boolean</text>
    <text x="455" y="300" font-size="13" fill="#1a1a1a">avgRating / numReviews : Number</text>
    <text x="455" y="320" font-size="13" fill="#1a1a1a">createdAt / updatedAt</text>
  </g>

  <!-- MenuItem -->
  <g>
    <rect x="840" y="90" width="260" height="220" rx="6" fill="#fff" stroke="#d97706" stroke-width="2"/>
    <rect x="840" y="90" width="260" height="30" rx="6" fill="#d97706"/>
    <text x="970" y="110" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">MenuItem</text>
    <text x="855" y="140" font-size="13" fill="#1a1a1a">_id : ObjectId (PK)</text>
    <text x="855" y="160" font-size="13" fill="#1a1a1a">restaurant : ObjectId (FK)</text>
    <text x="855" y="180" font-size="13" fill="#1a1a1a">name : String</text>
    <text x="855" y="200" font-size="13" fill="#1a1a1a">description : String</text>
    <text x="855" y="220" font-size="13" fill="#1a1a1a">price : Number</text>
    <text x="855" y="240" font-size="13" fill="#1a1a1a">category : String</text>
    <text x="855" y="260" font-size="13" fill="#1a1a1a">image : String</text>
    <text x="855" y="280" font-size="13" fill="#1a1a1a">isAvailable : Boolean</text>
    <text x="855" y="300" font-size="13" fill="#1a1a1a">createdAt / updatedAt</text>
  </g>

  <!-- Order -->
  <g>
    <rect x="440" y="470" width="300" height="340" rx="6" fill="#fff" stroke="#db2777" stroke-width="2"/>
    <rect x="440" y="470" width="300" height="30" rx="6" fill="#db2777"/>
    <text x="590" y="490" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Order</text>
    <text x="455" y="520" font-size="13" fill="#1a1a1a">_id : ObjectId (PK)</text>
    <text x="455" y="540" font-size="13" fill="#1a1a1a">customer : ObjectId (FK → User)</text>
    <text x="455" y="560" font-size="13" fill="#1a1a1a">restaurant : ObjectId (FK)</text>
    <text x="455" y="580" font-size="13" fill="#1a1a1a">deliveryPartner : ObjectId (FK,</text>
    <text x="475" y="598" font-size="13" fill="#1a1a1a">nullable → User)</text>
    <text x="455" y="618" font-size="13" fill="#1a1a1a">items[] : embedded array</text>
    <text x="475" y="636" font-size="12" fill="#555">(menuItem ref, name, price,</text>
    <text x="475" y="652" font-size="12" fill="#555">quantity — snapshotted, not live)</text>
    <text x="455" y="674" font-size="13" fill="#1a1a1a">totalAmount : Number</text>
    <text x="455" y="694" font-size="13" fill="#1a1a1a">deliveryAddress : String</text>
    <text x="455" y="714" font-size="13" fill="#1a1a1a">status : enum (6 states)</text>
    <text x="455" y="734" font-size="13" fill="#1a1a1a">paymentMethod / paymentStatus</text>
    <text x="455" y="754" font-size="13" fill="#1a1a1a">createdAt / updatedAt</text>
  </g>

  <!-- Review -->
  <g>
    <rect x="840" y="470" width="260" height="220" rx="6" fill="#fff" stroke="#7c3aed" stroke-width="2"/>
    <rect x="840" y="470" width="260" height="30" rx="6" fill="#7c3aed"/>
    <text x="970" y="490" font-size="14" font-weight="bold" fill="#fff" text-anchor="middle">Review</text>
    <text x="855" y="520" font-size="13" fill="#1a1a1a">_id : ObjectId (PK)</text>
    <text x="855" y="540" font-size="13" fill="#1a1a1a">customer : ObjectId (FK → User)</text>
    <text x="855" y="560" font-size="13" fill="#1a1a1a">restaurant : ObjectId (FK)</text>
    <text x="855" y="580" font-size="13" fill="#1a1a1a">order : ObjectId (FK, unique</text>
    <text x="875" y="598" font-size="13" fill="#1a1a1a">with customer)</text>
    <text x="855" y="618" font-size="13" fill="#1a1a1a">rating : Number (1–5)</text>
    <text x="855" y="638" font-size="13" fill="#1a1a1a">comment : String</text>
    <text x="855" y="658" font-size="13" fill="#1a1a1a">createdAt / updatedAt</text>
  </g>

  <!-- Relationships -->
  <!-- User -> Restaurant (owner) -->
  <line x1="310" y1="150" x2="440" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="330" y="143" font-size="12" fill="#333">1 owner → N restaurants</text>

  <!-- Restaurant -> MenuItem -->
  <line x1="710" y1="150" x2="840" y2="150" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="730" y="143" font-size="12" fill="#333">1 → N items</text>

  <!-- Restaurant -> Order -->
  <line x1="575" y1="340" x2="575" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="585" y="410" font-size="12" fill="#333">1 restaurant → N orders</text>

  <!-- User -> Order (customer) -->
  <line x1="175" y1="340" x2="440" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="200" y="430" font-size="12" fill="#333">1 user → N orders (as customer)</text>

  <!-- User -> Order (deliveryPartner) -->
  <line x1="200" y1="340" x2="440" y2="585" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
  <text x="140" y="460" font-size="12" fill="#777">0..1 user → N orders (as delivery partner)</text>

  <!-- MenuItem -> Order (snapshot) -->
  <line x1="970" y1="310" x2="740" y2="620" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
  <text x="755" y="430" font-size="12" fill="#777">snapshotted into items[]</text>
  <text x="755" y="446" font-size="12" fill="#777">(not a live reference)</text>

  <!-- Order -> Review -->
  <line x1="740" y1="580" x2="840" y2="580" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="745" y="573" font-size="12" fill="#333">1 order → 0..1 review</text>

  <!-- User -> Review (customer) -->
  <line x1="280" y1="340" x2="840" y2="540" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="520" y="330" font-size="12" fill="#333">1 user → N reviews (as customer)</text>

  <!-- Restaurant -> Review -->
  <line x1="650" y1="340" x2="900" y2="470" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="700" y="400" font-size="12" fill="#333">1 restaurant → N reviews</text>

  <!-- Legend -->
  <g>
    <rect x="1140" y="470" width="320" height="130" rx="6" fill="#fff" stroke="#ccc"/>
    <text x="1155" y="495" font-size="13" font-weight="bold" fill="#1a1a1a">Legend</text>
    <line x1="1155" y1="512" x2="1195" y2="512" stroke="#555" stroke-width="1.5" marker-end="url(#arrow)"/>
    <text x="1205" y="516" font-size="12" fill="#333">direct reference (ObjectId)</text>
    <line x1="1155" y1="536" x2="1195" y2="536" stroke="#999" stroke-width="1.5" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
    <text x="1205" y="540" font-size="12" fill="#333">optional reference</text>
    <line x1="1155" y1="560" x2="1195" y2="560" stroke="#999" stroke-width="1.5" stroke-dasharray="3,3"/>
    <text x="1205" y="564" font-size="12" fill="#333">data copied, not referenced live</text>
  </g>
</svg>
